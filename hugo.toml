url = "/live/"
weight = 2

[[menus.main]]
name = "Band"
url = "/band/"
weight = 3

[[menus.main]]
name = "Discography"
url = "/discography/"
weight = 4

[[menus.main]]
name = "Video"
url = "/video/"
weight = 5

[[menus.main]]
name = "Contact"
url = "/contact/"
weight = 6
